<style>

      --accent-ink: #2a1a0c;

  .stage-col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

  .life { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .life b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .lang {

    border: 1px solid var(--line);
    border-radius: 99px;
    padding: 4px 10px;
    cursor: pointer;
    font-weight: 700;
    font-size: 12px;

    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 16px;
    min-width: 0;

    flex-direction: column;

      radial-gradient(circle at 22% 62%, #3a2016 9px, transparent 10px),
      radial-gradient(circle at 68% 30%, #3a2016 8px, transparent 9px),
      radial-gradient(circle at 60% 72%, #3a2016 10px, transparent 11px),
      radial-gradient(circle at 80% 58%, #3a2016 7px, transparent 8px),
      radial-gradient(circle at 40% 42%, #3a2016 7px, transparent 8px),
      radial-gradient(circle at 50% 50%, #e0a86a, #b8742f 70%, #8a4d1f);

    transition: transform .08s ease;
    touch-action: manipulation;
  }

    position: absolute;
    width: 84px;
    height: 84px;
    border-radius: 50%;
    border: 2px solid #fff3b0;
    background: radial-gradient(circle at 35% 30%, #fff7c2, #f6c33e 55%, #b9790f);
    box-shadow: 0 0 28px #ffd25a, 0 0 6px #fff;
    cursor: pointer;
    transform: translate(-50%, -50%);
    animation: wiggle 1.4s ease-in-out infinite;
    z-index: 2;
  }
  @keyframes wiggle { 0%, 100% { rotate: -6deg; } 50% { rotate: 6deg; } }

  .float {
    position: absolute;
    pointer-events: none;
    font-weight: 800;
    color: var(--gold);
    transform: translate(-50%, 0);
    animation: rise .9s ease-out forwards;
    z-index: 3;
  }
  @keyframes rise { from { opacity: 1; } to { opacity: 0; translate: 0 -50px; } }

  #anger-stage { font-weight: 800; color: var(--hot); }

  .log li { color: var(--muted); font-size: 13px; padding-left: 10px; border-left: 2px solid var(--line); }
  .log li:first-child { color: var(--ink); border-color: var(--accent); }

  .side { position: relative; }
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 12px; }
  .tabs button {
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 99px;
    padding: 6px 12px;
    cursor: pointer;
    font-weight: 700;
    font-size: 13px;
  }
  .tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .modes { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; color: var(--muted); }
  .modes button {
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 4px 10px;
    cursor: pointer;
    font-variant-numeric: tabular-nums;
  }
  .modes button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 800; }

  .list { display: flex; flex-direction: column; gap: 8px; max-height: 62vh; overflow-y: auto; padding-right: 2px; }
  .row {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    text-align: left;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px 12px;
    cursor: pointer;
    flex: none;
  }
  .row:hover:not(:disabled) { border-color: var(--accent); }
  .row:disabled { opacity: .5; cursor: not-allowed; }
  .row:not(:disabled) { background: color-mix(in srgb, var(--accent) 6%, transparent); }
  .dot {
    width: 26px; height: 26px; border-radius: 50%; flex: none;

  .meta { display: flex; flex-direction: column; align-items: flex-end; font-variant-numeric: tabular-nums; font-size: 13px; text-align: right; flex: none; }
  .meta .count { color: var(--muted); font-size: 12px; }

  .ach.got { opacity: 1; border-color: var(--gold); background: color-mix(in srgb, var(--gold) 10%, transparent); }

  .big-btn {
    width: 100%;
    margin: 10px 0 6px;
    padding: 12px 14px;
    border: 0;
    border-radius: 12px;
    background: var(--accent);
    color: var(--accent-ink);
    font-weight: 800;

  .stat { border: 1px solid var(--line); border-radius: 12px; padding: 10px; }

<main class="app">
  <div class="stage-col">
    <header class="top">
      <div>
        <h1 data-i18n="title"></h1>

    <section class="bake" id="stage">

        <div data-i18n="unit.cookies"></div>

    <section class="panel-card">

      <div id="buildings" class="list"></div>
    </div>

    <div id="tab-upgrades" class="panel" hidden>
      <div id="upgrades" class="list"></div>
    </div>

    <div id="tab-achievements" class="panel" hidden>
      <p id="ach-summary"></p>
      <div id="achievements" class="ach-list"></div>
    </div>

    <div id="tab-wrath" class="panel" hidden>
      <div class="card-block">
        <p data-i18n="wrath.intro"></p>
      </div>
      <div class="card-block">
        <h2 data-i18n="pledge.title"></h2>
        <p data-i18n="pledge.desc"></p>
        <button id="pledge-btn" class="big-btn"></button>
        <small id="pledge-line"></small>
      </div>
      <div class="card-block">
        <h2 data-i18n="grimoire.title"></h2>
        <p data-i18n="grimoire.desc"></p>
        <small><span data-i18n="mana.label"></span> <b id="mana">0</b> / <span id="mana-max">200</span></small>
        <div id="spells" class="list"></div>
      </div>
    </div>

    <div id="tab-multiverse" class="panel" hidden>
      <div class="card-block">
        <h2 data-i18n="rift.title"></h2>
        <p data-i18n="rift.desc"></p>
        <small id="univ-line"></small>
        <button id="rift-btn" class="big-btn"></button>
        <small data-i18n="univ.list" style="display:block;margin-top:8px"></small>

    </div>

        <h2 data-i18n="ascend.title"></h2>

          <div class="stat"><small data-i18n="ascend.toEarn"></small><b id="ascend-gain">0</b></div>
          <div class="stat"><small data-i18n="ascend.chips"></small><b id="chips">0</b></div>

      <div class="card-block">
        <h2 data-i18n="life.stats"></h2>
        <div class="stat-grid">
          <div class="stat"><small data-i18n="stats.clicks"></small><b id="st-clicks">0</b></div>
          <div class="stat"><small data-i18n="stats.golden"></small><b id="st-golden">0</b></div>
          <div class="stat"><small data-i18n="stats.ascensions"></small><b id="st-asc">0</b></div>
          <div class="stat"><small data-i18n="stats.upgrades"></small><b id="st-up">0</b></div>
        </div>
        <button id="reset-btn" class="big-btn danger" data-i18n="reset.btn"></button>
      </div>
    </div>
  </aside>
</main>

<footer class="footer">
  <span data-i18n="footer.by"></span> <b>DoigtDePied</b> · <span id="version"></span>
</footer>

<div id="modal" class="modal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="m-title">

    <p id="m-text"></p>
    <div class="actions">
      <button id="m-cancel" data-i18n="ui.cancel"></button>
      <button id="m-ok" class="primary"></button>

  </div>
</div>

  function T(key, vars) {
    const table = STR[LANG] || STR.fr;
    let text = table[key];
    if (text === undefined) text = STR.fr[key] !== undefined ? STR.fr[key] : key;
    if (vars) {
      for (const k of Object.keys(vars)) text = text.split('{' + k + '}').join(String(vars[k]));
    }
    return text;
  }

  // Number formatting follows the language: comma decimals in French, dot in English.
  const decSep = () => (LANG === 'fr' ? ',' : '.');
  const fmt = (n) => {
    if (!isFinite(n)) return '∞';
    let out;
    if (n < 10) out = (Math.floor(n * 10) / 10).toFixed(1);
    else if (n < 1000) out = String(Math.floor(n));
    else {
      const exp = Math.floor(Math.log10(n) / 3);
      if (exp >= SUF.length) return n.toExponential(2).replace('+', '').replace('.', decSep());
      const v = n / Math.pow(1000, exp);
      out = v.toFixed(v < 10 ? 2 : v < 100 ? 1 : 0) + SUF[exp];
    }
    return out.replace('.', decSep());
  };

  function costOf(b, count) {
    const n = B(b.key).n;
    return b.base * Math.pow(RATE, n) * (Math.pow(RATE, count) - 1) / (RATE - 1);
  }

  function maxAfford(b) {
    let c = b.base * Math.pow(RATE, B(b.key).n);
    let total = 0;
    let k = 0;
    while (k < 2000 && total + c <= S.run.cookies) {
      total += c;
      c *= RATE;
      k++;
    }
    return k;
  }

  function rawCps() {
    const mut = S.run.buffs.find((b) => b.key === 'mutant');
    const mutMult = S.heaven['h-mut'] ? 3 : 2;
    return BUILDINGS.reduce((t, b) => {
      const m = (mut && mut.target === b.key ? mutMult : 1) * (has('recipe-' + b.key) ? 3 : 1);
      const gm = b.key === 'grandma' ? perkMult('grandma') : 1;
      return t + B(b.key).n * b.cps * B(b.key).m * m * gm;
    }, 0);
  }

  function stageIndex() {
    const a = S.run.anger;
    return a >= 100 ? 4 : a >= 75 ? 3 : a >= 50 ? 2 : a >= 25 ? 1 : 0;
  }

  function stagePenalty() {
    if (B('grandma').n <= 0 || S.run.pledgeLeft > 0) return 1;
    return STAGE_MULT[stageIndex()];
  }

  function cpsNow() {
    let m = S.run.mods.globalMult * chipMult() * (1 + 0.01 * achCount()) * perkProd();
    if (has('frenzy')) m *= 7;
    if (has('clot')) m *= 0.5;
    if (has('blessing')) m *= 1.5;
    if (has('dragon')) m *= 3;
    const uni = S.run.buffs.find((b) => b.key === 'universe');
    if (uni) m *= uni.target;
    return rawCps() * m * stagePenalty();
  }

  function clickValue(preview) {
    const m = S.run.mods;
    let v = (1 + m.clickAdd) * m.clickMult * chipMult() * (1 + 0.01 * achCount()) * perkMult('click');
    // Keep clicks relevant late-game: at least 0.1% of current production per click.
    v += cpsNow() * 0.001;
    if (has('storm')) v *= 77;
    if (has('tsunami')) v *= 0.5;
    if (has('disco')) v *= (preview ? 2.5 : 0.5 + Math.random() * 4.5);
    v *= 1 + Math.min(combo, comboCap()) * 0.02;
    return v;
  }

  function pledgeCost() {
    return Math.max(1000, rawCps() * 600) * Math.pow(1.4, Math.min(S.run.pledges, 10));
  }

  function riftCost() {
    return Math.max(5000, rawCps() * 120);

  function claimGolden(el) {
    if (el !== goldenEl) return;
    const total = GOLD.reduce((t, g) => t + g.w, 0);
    let r = Math.random() * total;
    let pick = GOLD[0];
    for (const g of GOLD) {
      if (r < g.w) { pick = g; break; }
      r -= g.w;
    }
    const msg = pick.run();
    el.remove();
    goldenEl = null;
    S.life.golden++;
    S.run.goldenIn = rand(70, 150);
    log(T('log.golden', { name: pick.name(), msg }));
  }

  function runEvent() {
    const ev = pickRandom(EVENTS);
    S.life.events++;
    log(T('log.event', { name: ev.name(), msg: ev.run() }));
  }

  // Permanent perks from every visited universe.
  function perkValues(type) {
    return S.universes.map((u) => UNIV_TPL[u.tpl].perk).filter((p) => p.type === type).map((p) => p.v);
  }
  const perkMult = (type) => perkValues(type).reduce((t, v) => t * v, 1);
  const perkProd = () => 1 + perkValues('prod').reduce((t, v) => t + v, 0);
  const perkChip = () => 1 + perkValues('chip').reduce((t, v) => t + v, 0);
  const manaCap = () => MANA_CAP + perkValues('manaCap').reduce((t, v) => t + v, 0);
  const chipMult = () => 1 + 0.10 * Math.sqrt(S.chips) * perkChip();

  // Tolls paid to revisit a universe.
  function tollOf(tpl) {
    const def = UNIV_TPL[tpl];
    switch (def.toll) {
      case 'cookies': return { type: 'cookies', amt: Math.max(2000, rawCps() * 150) };
      case 'mana': return { type: 'mana', amt: def.amt };
      case 'anger': return { type: 'anger', amt: def.amt };
      case 'grandmas': return { type: 'grandmas', amt: Math.max(1, Math.floor(B('grandma').n * 0.1)) };
      default: return { type: 'chips', amt: 1 };
    }
  }

  function canPay(toll) {
    const R = S.run;
    switch (toll.type) {
      case 'cookies': return R.cookies >= toll.amt;
      case 'mana': return R.mana >= toll.amt;
      case 'anger': return true;
      case 'grandmas': return B('grandma').n >= toll.amt;
      default: return S.chips - heavenSpent() >= toll.amt;
    }
  }

  function payToll(toll) {
    const R = S.run;
    switch (toll.type) {
      case 'cookies': R.cookies -= toll.amt; break;
      case 'mana': R.mana -= toll.amt; break;
      case 'anger': R.anger = Math.min(100, R.anger + toll.amt); break;
      case 'grandmas': B('grandma').n -= toll.amt; break;
      default: S.chips -= toll.amt;
    }
  }

  const tollLabel = (toll) => T('toll.' + toll.type, { v: fmt(toll.amt) });

  // Applies a universe's temporary boost. Visiting again costs a toll, handled by the caller.
  function enterUniverse(idx, paidToll) {
    const u = S.universes[idx];
    u.visits++;
    S.life.universes++;
    addBuff('universe', paidToll ? 60 : 90, u.mult, u.name);
  }

  function openRift() {
    const taken = S.universes.map((u) => u.tpl);
    const pool = UNIV_TPL.map((_, i) => i).filter((i) => !taken.includes(i));
    if (pool.length === 0) {
      // Every universe is already known: the rift drops you into one you have visited.
      const idx = Math.floor(Math.random() * S.universes.length);
      enterUniverse(idx, false);
      return T('log.rift', { name: S.universes[idx].name, m: numText(S.universes[idx].mult) });
    }
    const tpl = pickRandom(pool);
    const name = T('univ.' + tpl) + ' ' + Math.floor(rand(1, 999));
    const mult = Math.round(rand(2, 12) * 10) / 10;
    S.universes.push({ tpl, name, mult, visits: 0 });
    const idx = S.universes.length - 1;
    enterUniverse(idx, false);
    return T('log.rift', { name, m: numText(mult) }) + ' ' +
      T('log.newPerk', { p: T('univ.' + tpl + '.perk') });
  }

  function revisit(idx) {
    const u = S.universes[idx];
    if (!u) return;
    const toll = tollOf(u.tpl);
    if (!canPay(toll)) return;
    payToll(toll);
    S.life.revisits++;
    enterUniverse(idx, true);
    log(T('log.revisit', { name: u.name, toll: tollLabel(toll), m: numText(u.mult) }));
    render();
  }

  // Visited universes list, rebuilt when its content or language changes, refreshed on every render.
  function renderUniverses() {
    const list = $('#univ-list');
    const sig = LANG + '|' + S.universes.length;
    if (sig !== lastUnivSig) {
      lastUnivSig = sig;
      list.innerHTML = '';
      if (S.universes.length === 0) {
        const none = document.createElement('small');
        none.textContent = T('univ.none');
        list.appendChild(none);
      }
      S.universes.forEach((u, i) => {
        const el = document.createElement('button');
        el.className = 'row';
        el.dataset.revisit = i;
        el.innerHTML =
          '<span class="info"><b></b><small></small></span>' +
          '<span class="meta"><span class="count"></span><span class="cost"></span></span>';
        list.appendChild(el);
      });
    }
    if (S.universes.length === 0) return;
    S.universes.forEach((u, i) => {
      const el = list.children[i];
      const toll = tollOf(u.tpl);
      el.querySelector('b').textContent = u.name;
      el.querySelector('small').textContent = T('univ.' + u.tpl + '.perk') + ' · ' + tollLabel(toll);
      el.querySelector('.count').textContent = T('univ.visits', { n: u.visits });
      el.querySelector('.cost').textContent = T('univ.revisit');
      el.disabled = !canPay(toll);
    });
  }

  function castSpell(id) {
    const sp = SPELLS.find((x) => x.id === id);
    const R = S.run;
    if (!sp || R.mana < sp.cost) return;
    if (R.lastSpell === id) return; // the same spell cannot be cast twice in a row
    if (R.cooldowns[id] > 0) return;
    if (sp.unlocked && !sp.unlocked()) return;
    if (sp.id === 'summon' && goldenEl) return;
    R.mana -= sp.cost;
    R.lastSpell = id;
    if (sp.cooldown) R.cooldowns[id] = sp.cooldown;
    S.life.spells++;
    log(T('log.spell', { name: sp.name(), msg: sp.cast() }));
    render();
  }

  function buyRift() {
    const c = riftCost();
    if (S.run.cookies < c) return;
    const taken = S.universes.map((u) => u.tpl);
    const pool = UNIV_TPL.map((_, i) => i).filter((i) => !taken.includes(i));
    if (pool.length === 0) return;
    S.run.cookies -= c;
    log(openRift());
    render();
  }

  function swearPledge() {
    const R = S.run;
    const c = pledgeCost();
    if (R.pledgeLeft > 0 || R.cookies < c) return;
    R.cookies -= c;
    R.pledges++;
    S.life.pledges++;
    R.pledgeLeft = 60 + R.mods.pledgeBonus;
    R.anger = Math.max(0, R.anger - 20);
    log(T('log.pledgeSwear'));
    render();
  }

  function heavenSpent() {
    return Object.keys(S.heaven).reduce((t, id) => {
      const h = HEAVEN.find((x) => x.id === id);
      return t + (h ? h.cost : 0);
    }, 0);
  }

  function buyHeaven(id) {
    const h = HEAVEN.find((x) => x.id === id);
    if (!h || S.heaven[id] || S.chips - heavenSpent() < h.cost) return;
    S.heaven[id] = true;
    log(T('log.heaven', { name: T('hv.' + id.slice(2) + '.name') }));
    render();
  }

  function doAscend() {
    const g = ascendGain();
    if (g < 1) return;
    S.chips += g;
    S.life.ascensions++;
    S.run = freshRun();
    if (S.heaven['h-head']) S.run.cookies = 1000;
    if (goldenEl) { goldenEl.remove(); goldenEl = null; }
    lastStage = 0;
    lastBuffSig = '';
    log(T('log.ascend', { n: g, chips: T(g > 1 ? 'chips.many' : 'chips.one') }));
    save();
    render();
  }

  function ask(title, text, ok, fn) {
    $('#m-title').textContent = title;
    $('#m-text').textContent = text;
    $('#m-ok').textContent = ok;
    pendingOk = fn;
    $('#modal').hidden = false;
    $('#m-ok').focus();
  }

  function buyBuilding(key) {
    const b = BUILDINGS.find((x) => x.key === key);
    const count = qty(b);
    if (count < 1) return;
    const cost = costOf(b, count);
    if (S.run.cookies < cost) return;
    S.run.cookies -= cost;
    const was = B(key).n;
    B(key).n += count;
    if (key === 'grandma' && was === 0) log(T('log.grandmaArrive'));
    render();
  }

  // Upgrades: generated per building, plus click, achievement and grandma ones.
  const UPG = [];
  BUILDINGS.forEach((b) => {
    UPG.push({
      id: b.key + '-1', cost: b.base * 10,
      name: () => T('up.t1.name', { n: bName(b) }),
      desc: () => T('up.t1.desc', { n: bName(b) }),
      req: () => B(b.key).n >= 1,
      reqText: () => T('up.t1.req', { n: bName(b) }),
      apply: () => { B(b.key).m *= 2; },
    });
    UPG.push({
      id: b.key + '-2', cost: b.base * 500,
      name: () => T('up.t2.name', { n: bName(b) }),
      desc: () => T('up.t2.desc', { n: bName(b) }),
      req: () => B(b.key).n >= 25,
      reqText: () => T('up.t2.req', { n: bName(b) }),
      apply: () => { B(b.key).m *= 2; },
    });
    UPG.push({
      id: b.key + '-3', cost: b.base * 5e4,
      name: () => T('up.t3.name', { n: bName(b) }),
      desc: () => T('up.t3.desc', { n: bName(b) }),
      req: () => B(b.key).n >= 100,
      reqText: () => T('up.t3.req', { n: bName(b) }),
      apply: () => { B(b.key).m *= 3; },
    });
  });
  UPG.push(
    { id: 'click-1', cost: 100, name: () => T('up.click1.name'), desc: () => T('up.click1.desc'),
      req: () => true, reqText: () => T('up.always'),
      apply: () => { S.run.mods.clickAdd += 1; } },
    { id: 'click-2', cost: 5000, name: () => T('up.click2.name'), desc: () => T('up.click2.desc'),
      req: () => S.run.clicks >= 500, reqText: () => T('up.click2.req'),
      apply: () => { S.run.mods.clickAdd += 5; } },
    { id: 'click-3', cost: 1e6, name: () => T('up.click3.name'), desc: () => T('up.click3.desc'),
      req: () => S.run.clicks >= 5000, reqText: () => T('up.click3.req'),
      apply: () => { S.run.mods.clickMult *= 2; } },
    { id: 'click-4', cost: 5e8, name: () => T('up.click4.name'), desc: () => T('up.click4.desc'),
      req: () => S.run.clicks >= 50000, reqText: () => T('up.click4.req'),
      apply: () => { S.run.mods.clickAdd += 100; } },
    { id: 'ach-1', cost: 5e4, name: () => T('up.ach1.name'), desc: () => T('up.ach1.desc'),
      req: () => achCount() >= 5, reqText: () => T('up.ach1.req'),
      apply: () => { S.run.mods.globalMult *= 1.05; } },
    { id: 'ach-2', cost: 1e7, name: () => T('up.ach2.name'), desc: () => T('up.ach2.desc'),
      req: () => achCount() >= 15, reqText: () => T('up.ach2.req'),
      apply: () => { S.run.mods.globalMult *= 1.1; } },
    { id: 'ach-3', cost: 1e10, name: () => T('up.ach3.name'), desc: () => T('up.ach3.desc'),
      req: () => achCount() >= 30, reqText: () => T('up.ach3.req'),
      apply: () => { S.run.mods.globalMult *= 1.15; } },
    { id: 'grandma-wool', cost: 1e5, name: () => T('up.grandmaWool.name'), desc: () => T('up.grandmaWool.desc'),
      req: () => B('grandma').n >= 10, reqText: () => T('up.grandmaWool.req'),
      apply: () => { B('grandma').m *= 2; } },
    { id: 'wrath-tea', cost: 2e6, name: () => T('up.tea.name'), desc: () => T('up.tea.desc'),
      req: () => S.life.pledges >= 2, reqText: () => T('up.tea.req'),
      apply: () => { S.run.mods.pledgeBonus += 30; } },
  );

  function buyUpgrade(id) {
    const u = UPG.find((x) => x.id === id);
    const R = S.run;
    if (!u || R.bought[id] || !u.req() || R.cookies < u.cost) return;
    R.cookies -= u.cost;
    R.bought[id] = true;
    u.apply();
    S.life.upgrades++;
    log(T('log.upgrade', { name: u.name() }));
    render();
  }

  // Achievements persist across ascensions.
  const ACH = [];
  const addAch = (id, test, nameKey, descKey, vars) => ACH.push({
    id, test,
    name: () => T(nameKey, vars ? vars() : undefined),
    desc: () => T(descKey, vars ? vars() : undefined),
  });
  addAch('bake-1e3', () => S.life.baked >= 1e3, 'ach.bake1e3.name', 'ach.bake1e3.desc');
  addAch('bake-1e6', () => S.life.baked >= 1e6, 'ach.bake1e6.name', 'ach.bake1e6.desc');
  addAch('bake-1e9', () => S.life.baked >= 1e9, 'ach.bake1e9.name', 'ach.bake1e9.desc');
  addAch('bake-1e12', () => S.life.baked >= 1e12, 'ach.bake1e12.name', 'ach.bake1e12.desc');
  addAch('bake-1e15', () => S.life.baked >= 1e15, 'ach.bake1e15.name', 'ach.bake1e15.desc');
  addAch('click-100', () => S.life.clicks >= 100, 'ach.click100.name', 'ach.click100.desc');
  addAch('click-1000', () => S.life.clicks >= 1000, 'ach.click1000.name', 'ach.click1000.desc');
  addAch('click-10000', () => S.life.clicks >= 10000, 'ach.click10000.name', 'ach.click10000.desc');

  addAch('gold-10', () => S.life.golden >= 10, 'ach.gold10.name', 'ach.gold10.desc');
  addAch('gold-50', () => S.life.golden >= 50, 'ach.gold50.name', 'ach.gold50.desc');
  addAch('pledge-1', () => S.life.pledges >= 1, 'ach.pledge1.name', 'ach.pledge1.desc');
  addAch('pledge-5', () => S.life.pledges >= 5, 'ach.pledge5.name', 'ach.pledge5.desc');
  addAch('asc-1', () => S.life.ascensions >= 1, 'ach.asc1.name', 'ach.asc1.desc');
  addAch('asc-3', () => S.life.ascensions >= 3, 'ach.asc3.name', 'ach.asc3.desc');

  addAch('up-30', () => S.life.upgrades >= 30, 'ach.up30.name', 'ach.up30.desc');
  addAch('univ-1', () => S.life.universes >= 1, 'ach.univ1.name', 'ach.univ1.desc');
  addAch('univ-10', () => S.life.universes >= 10, 'ach.univ10.name', 'ach.univ10.desc');
  addAch('ev-10', () => S.life.events >= 10, 'ach.ev10.name', 'ach.ev10.desc');
  addAch('ev-50', () => S.life.events >= 50, 'ach.ev50.name', 'ach.ev50.desc');
  addAch('spell-1', () => S.life.spells >= 1, 'ach.spell1.name', 'ach.spell1.desc');
  addAch('combo-50', () => S.life.bestCombo >= 50, 'ach.combo50.name', 'ach.combo50.desc');
  addAch('heaven-1', () => Object.keys(S.heaven).length >= 1, 'ach.heaven1.name', 'ach.heaven1.desc');
  addAch('dragon-1', () => S.life.dragons >= 1, 'ach.dragon1.name', 'ach.dragon1.desc');
  addAch('disc-1', () => S.universes.length >= 1, 'ach.disc1.name', 'ach.disc1.desc');
  addAch('disc-5', () => S.universes.length >= 5, 'ach.disc5.name', 'ach.disc5.desc');
  addAch('disc-10', () => S.universes.length >= 10, 'ach.disc10.name', 'ach.disc10.desc');
  addAch('rev-1', () => S.life.revisits >= 1, 'ach.rev1.name', 'ach.rev1.desc');
  addAch('rev-10', () => S.life.revisits >= 10, 'ach.rev10.name', 'ach.rev10.desc');
  addAch('fidele-5', () => S.universes.some((u) => u.visits >= 5), 'ach.fidele5.name', 'ach.fidele5.desc');
  BUILDINGS.forEach((b) => {
    addAch('own-' + b.key, () => B(b.key).n >= 10, 'ach.own.name', 'ach.own.desc', () => ({ n: bName(b) }));
  });

  // Rebuild every list from scratch so names follow the current language.
  function fillLists() {
    rowEls = {}; upEls = {}; achEls = {}; hvEls = {}; spellEls = {};

    const bl = $('#buildings');
    bl.innerHTML = '';
    BUILDINGS.forEach((b, i) => {
      const el = document.createElement('button');
      el.className = 'row';
      el.dataset.buy = b.key;
      el.style.setProperty('--h', String((i * 27 + 20) % 360));
      el.innerHTML =
        '<span class="dot"></span>' +
        '<span class="info"><b></b><small></small></span>' +
        '<span class="meta"><span class="count"></span><span class="cost"></span></span>';
      el.querySelector('b').textContent = bName(b);
      bl.appendChild(el);
      rowEls[b.key] = el;
    });

    const ul = $('#upgrades');
    ul.innerHTML = '';
    UPG.forEach((u) => {
      const el = document.createElement('button');
      el.className = 'row';
      el.dataset.up = u.id;
      el.innerHTML =
        '<span class="info"><b></b><small></small></span>' +
        '<span class="meta"><span class="cost"></span></span>';
      el.querySelector('b').textContent = u.name();
      ul.appendChild(el);
      upEls[u.id] = el;
    });

    const al = $('#achievements');
    al.innerHTML = '';
    ACH.forEach((a) => {
      const el = document.createElement('div');
      el.className = 'ach';
      const b = document.createElement('b');
      b.textContent = a.name();
      const sm = document.createElement('small');
      sm.textContent = a.desc();
      el.appendChild(b);
      el.appendChild(sm);
      al.appendChild(el);
      achEls[a.id] = el;
    });

    const sl = $('#spells');
    sl.innerHTML = '';
    SPELLS.forEach((sp) => {
      const el = document.createElement('button');
      el.className = 'row';
      el.dataset.spell = sp.id;
      el.innerHTML =
        '<span class="info"><b></b><small></small></span>' +
        '<span class="meta"><span class="cost"></span></span>';
      el.querySelector('b').textContent = sp.name();
      el.querySelector('small').textContent = sp.desc();
      sl.appendChild(el);
      spellEls[sp.id] = el;
    });

    const hl = $('#heaven');
    hl.innerHTML = '';
    HEAVEN.forEach((h) => {
      const el = document.createElement('button');
      el.className = 'row';
      el.dataset.hv = h.id;
      el.innerHTML =
        '<span class="info"><b></b><small></small></span>' +
        '<span class="meta"><span class="cost"></span></span>';
      const key = 'hv.' + h.id.slice(2);
      el.querySelector('b').textContent = T(key + '.name');
      el.querySelector('small').textContent = T(key + '.desc');
      hl.appendChild(el);
      hvEls[h.id] = el;
    });
  }

  // Static texts (anything carrying data-i18n attributes) and language-dependent labels.
  function applyStatic() {
    document.documentElement.lang = LANG;
    document.title = T('title');
    $$('[data-i18n]').forEach((el) => { el.textContent = T(el.dataset.i18n); });
    $$('[data-i18n-aria]').forEach((el) => { el.setAttribute('aria-label', T(el.dataset.i18nAria)); });
    $('#ui-cancel-placeholder') && ($('#ui-cancel-placeholder').textContent = T('ui.cancel'));
    $('#m-cancel').textContent = T('ui.cancel');
    $('#lang-btn').textContent = T('lang.toggle');
    $('#version').textContent = T('footer.version', { v: VERSION, label: T('release.label') });
    $('#heaven-title') && ($('#heaven-title').textContent = T('heaven.title'));
    $('#m-ok').textContent = T('ui.ok');
    $('#reset-btn').textContent = T('reset.btn');
  }

  function setLang(next) {
    LANG = next;
    try { localStorage.setItem(LANG_KEY, next); } catch (e) { /* ignore */ }
    applyStatic();
    fillLists();
    lastBuffSig = '';
    lastUnivSig = '';
    render();
  }

  function renderBuffs() {
    const sig = S.run.buffs.map((b) => b.key + Math.ceil(b.left)).join('|');
    if (sig === lastBuffSig) return;
    lastBuffSig = sig;
    $('#buffs').innerHTML = S.run.buffs
      .map((b) => {
        const label = b.label || T('buff.' + b.key);
        return '<span class="buff ' + b.key + '">' + label + ' <span>' + Math.ceil(b.left) + 's</span></span>';
      })
      .join('');
  }

  function render() {
    const R = S.run;
    $('#cookies').textContent = fmt(R.cookies);
    $('#cps').textContent = fmt(cpsNow());
    $('#click').textContent = fmt(clickValue(true));
    $('#lifetime').textContent = fmt(S.life.baked);
    renderBuffs();

    const si = stageIndex();
    $('#anger-fill').style.width = R.anger + '%';
    $('#anger-meter').setAttribute('aria-valuenow', String(Math.floor(R.anger)));
    $('#anger-stage').textContent = T('stage.' + si);
    $('#anger-num').textContent = T('wrath.num', {
      a: Math.floor(R.anger),
      state: T(R.pledgeLeft > 0 ? 'wrath.pledgeActive' : 'wrath.rising'),
    });
    const pen = Math.round((1 - stagePenalty()) * 100);
    $('#stage-mult').textContent = pen > 0 ? T('pen.value', { n: pen }) : T('pen.none');

    const pc = pledgeCost();
    const pb = $('#pledge-btn');
    pb.disabled = R.pledgeLeft > 0 || R.cookies < pc;
    pb.textContent = R.pledgeLeft > 0 ? T('pledge.active', { s: Math.ceil(R.pledgeLeft) }) : T('pledge.btn');
    $('#pledge-line').textContent = T('pledge.line', { c: fmt(pc), n: R.pledges });

    $('#mana').textContent = fmt(R.mana);
    $('#mana-max').textContent = manaCap();
    SPELLS.forEach((sp) => {
      const el = spellEls[sp.id];
      const locked = !!sp.unlocked && !sp.unlocked();
      const cd = R.cooldowns[sp.id] || 0;
      el.disabled = locked || R.mana < sp.cost || R.lastSpell === sp.id || (sp.id === 'summon' && !!goldenEl) || cd > 0;
      el.querySelector('small').textContent = locked ? sp.lockText() : sp.desc();
      el.querySelector('.cost').textContent = cd > 0 ? Math.ceil(cd) + 's' : sp.cost + ' ' + T('mana.label').toLowerCase();
    });

    const rc = riftCost();
    $('#rift-btn').textContent = T('rift.btn', { c: fmt(rc) });
    const allVisited = S.universes.length >= UNIV_TPL.length;
    $('#rift-btn').disabled = R.cookies < rc || allVisited;
    $('#univ-line').textContent = T('rift.visited', { n: S.life.universes });
    renderUniverses();

    const g = ascendGain();
    $('#ascend-gain').textContent = g;
    $('#chips').textContent = S.chips;
    $('#chip-bonus').textContent = '+' + numText(Math.round((chipMult() - 1) * 1000) / 10) + ' %';
    $('#run-baked').textContent = fmt(R.baked);
    const need = Math.pow(g + 1, 3) * 1e9 - R.baked;
    $('#next-chip').textContent = T('ascend.next', { c: fmt(need) });
    $('#ascend-btn').disabled = g < 1;
    $('#st-clicks').textContent = fmt(S.life.clicks);
    $('#st-golden').textContent = S.life.golden;
    $('#st-asc').textContent = S.life.ascensions;
    $('#st-up').textContent = S.life.upgrades;

    BUILDINGS.forEach((b) => {
      const el = rowEls[b.key];
      const n = B(b.key).n;
      const count = buyMode === 'max' ? Math.max(1, maxAfford(b)) : buyMode;
      const cost = costOf(b, count);
      el.disabled = buyMode === 'max' ? maxAfford(b) < 1 : R.cookies < cost;
      el.querySelector('.count').textContent = T('bld.owned', { n });
      el.querySelector('.cost').textContent = (buyMode === 'max' ? '×' + count + ' · ' : '') + fmt(cost);
      el.querySelector('small').textContent = bDesc(b) + ' ' + T('bld.perEach', { v: fmt(b.cps * B(b.key).m) });
    });

    UPG.forEach((u) => {
      const el = upEls[u.id];
      const done = !!R.bought[u.id];
      const ok = !done && u.req();
      el.classList.toggle('done', done);
      el.classList.toggle('locked', !done && !ok);
      el.disabled = done || !ok || R.cookies < u.cost;
      el.querySelector('small').textContent = done ? T('up.done') : ok ? u.desc() : T('up.req', { r: u.reqText() });
      el.querySelector('.cost').textContent = done ? '' : fmt(u.cost);
    });

    const avail = S.chips - heavenSpent();
    const hvText = $('#hv-text');
    if (hvText) hvText.textContent = T('heaven.intro', { n: avail });
    HEAVEN.forEach((h) => {
      const el = hvEls[h.id];
      if (!el) return;
      const owned = !!S.heaven[h.id];
      el.classList.toggle('done', owned);
      el.disabled = owned || avail < h.cost;
      el.querySelector('.cost').textContent = owned ? T('heaven.owned') : T('heaven.cost', { c: h.cost });
    });

    ACH.forEach((a) => {
      achEls[a.id].classList.toggle('got', !!S.ach[a.id]);
    });
    $('#ach-summary').textContent = T('ach.summary', { n: achCount(), t: ACH.length });
  }

  function tick() {
    const t = performance.now();
    const dt = Math.min(1, (t - last) / 1000);
    last = t;
    const R = S.run;
    R.time += dt;

    R.buffs.forEach((b) => { b.left -= dt; });
    R.buffs = R.buffs.filter((b) => b.left > 0);
    Object.keys(R.cooldowns).forEach((k) => {
      R.cooldowns[k] = Math.max(0, R.cooldowns[k] - dt);
      if (R.cooldowns[k] <= 0) delete R.cooldowns[k];
    });

    // Mana regenerates, faster with grandmas and the grimoire upgrade.
    const g = B('grandma').n;
    R.mana = Math.min(manaCap(), R.mana + dt * (0.3 + g * 0.02) * (S.heaven['h-grimoire'] ? 2 : 1) * perkMult('mana'));

    // Grandma anger
    let rate;
    if (R.pledgeLeft > 0 || has('bingo')) rate = 0;
    else if (has('gravity')) rate = -1.2;
    else if (g <= 0) rate = -0.3;
    else rate = (0.2 + 0.012 * g) * (1 + R.time / 900) * (S.heaven['h-immortal'] ? 0.5 : 1) * perkMult('anger');
    R.anger = Math.min(100, Math.max(0, R.anger + rate * dt));

    const si = stageIndex();
    if (si !== lastStage) {
      log(si > lastStage ? T('stageText.' + si) : T('log.stageDown'));
      lastStage = si;
    }

    if (R.pledgeLeft > 0) {
      R.pledgeLeft = Math.max(0, R.pledgeLeft - dt);
      if (R.pledgeLeft === 0) log(T('log.pledgeOver'));
    }

    // Grandma raids at high anger, unless pledged or insured.
    if (si >= 2 && R.pledgeLeft <= 0 && g > 0 && !S.heaven['h-chaos']) {
      R.raidIn -= dt;
      if (R.raidIn <= 0) {
        R.raidIn = rand(100, 160);
        const loss = R.cookies * (si >= 4 ? 0.1 : 0.03);
        R.cookies -= loss;
        log(T('log.raid', { g: fmt(loss) }));
      }
    }

    // Random events and cookie rain
    R.eventIn -= dt * perkMult('events');
    if (R.eventIn <= 0) {
      R.eventIn = rand(150, 260) * (S.heaven['h-chaos'] ? 0.5 : 1);
      runEvent();
    }
    if (has('rain')) addCookies(Math.max(clickValue() * 20, cpsNow() * 0.05) * dt);

    // Golden cookies
    if (goldenEl) {
      goldenLeft -= dt;
      if (goldenLeft <= 0) { goldenEl.remove(); goldenEl = null; R.goldenIn = rand(70, 150); }
    } else {
      R.goldenIn -= dt * (S.heaven['h-lucky'] ? 1.5 : 1) * perkMult('golden');
      if (R.goldenIn <= 0) spawnGolden();
    }

    addCookies(cpsNow() * dt);

    for (const a of ACH) {
      if (!S.ach[a.id] && a.test()) {
        S.ach[a.id] = true;
        log(T('log.achievement', { name: a.name() }));
      }
    }

    render();
  }

  function init() {
    LANG = loadLang();
    const loaded = loadState();
    S = loaded || blank();

    // Heavenly card is part of the Ascend tab; it is created once and kept.
    const hv = document.createElement('div');
    hv.className = 'card-block';
    hv.innerHTML = '<h2 id="heaven-title"></h2><p id="hv-text"></p><div id="heaven" class="list"></div>';
    $('#tab-ascend').insertBefore(hv, $('#tab-ascend').children[1]);

    applyStatic();
    fillLists();

    if (loaded) {
      const away = Math.min(8 * 3600, (Date.now() - S.saved) / 1000);
      if (away > 30) {
        const gain = cpsNow() * away * 0.5;
        addCookies(gain);
        log(T('log.away', { g: fmt(gain) }));
      } else {
        log(T('log.welcomeBack'));
      }
    } else {
      log(T('log.welcomeNew'));
    }
    lastStage = stageIndex();

    $('#lang-btn').addEventListener('click', () => setLang(LANG === 'fr' ? 'en' : 'fr'));

    $('#cookie').addEventListener('click', () => {
      const now = performance.now();
      combo = now - lastClick < 600 ? combo + 1 : 0;
      lastClick = now;
      if (combo > S.life.bestCombo) S.life.bestCombo = combo;
      if (combo > 0 && combo % 25 === 0) log(T('log.combo', { n: combo }));
      const v = clickValue();
      addCookies(v);
      S.run.clicks++;
      S.life.clicks++;
      S.run.mana = Math.min(manaCap(), S.run.mana + 0.05);
      floatText('+' + fmt(v));
      const c = $('#cookie');
      c.classList.remove('pop');
      void c.offsetWidth;
      c.classList.add('pop');
      setTimeout(() => c.classList.remove('pop'), 90);
      render();
    });

    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && $('#modal').hidden && !e.target.closest('button, input, a')) {
        e.preventDefault();
        $('#cookie').click();
      }
    });

    $('#buildings').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-buy]');
      if (btn) buyBuilding(btn.dataset.buy);
    });
    $('#upgrades').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-up]');
      if (btn) buyUpgrade(btn.dataset.up);
    });
    $('#spells').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-spell]');
      if (btn) castSpell(btn.dataset.spell);
    });
    $('#heaven').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-hv]');
      if (btn) buyHeaven(btn.dataset.hv);
    });
    $('#rift-btn').addEventListener('click', buyRift);
    $('#univ-list').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-revisit]');
      if (btn) revisit(Number(btn.dataset.revisit));
    });

    $$('[data-mode]').forEach((btn) => {
      btn.addEventListener('click', () => {
        buyMode = btn.dataset.mode === 'max' ? 'max' : Number(btn.dataset.mode);
        $$('[data-mode]').forEach((b) => b.setAttribute('aria-pressed', String(b === btn)));
        render();
      });
    });

    $$('[data-tab]').forEach((btn) => {
      btn.addEventListener('click', () => {
        $$('[data-tab]').forEach((b) => b.setAttribute('aria-selected', String(b === btn)));
        $$('.panel').forEach((p) => { p.hidden = p.id !== 'tab-' + btn.dataset.tab; });
      });
    });

    $('#pledge-btn').addEventListener('click', swearPledge);

    $('#ascend-btn').addEventListener('click', () => {
      const g = ascendGain();
      if (g < 1) return;
      ask(T('ascend.askTitle'),
        T('ascend.askText', { n: g, chips: T(g > 1 ? 'chips.many' : 'chips.one') }),
        T('ui.ascendOk'), doAscend);
    });

    $('#reset-btn').addEventListener('click', () => {
      ask(T('reset.askTitle'), T('reset.askText'), T('reset.ok'), () => {
        try { localStorage.removeItem(KEY); } catch (e) { /* ignore */ }
        location.reload();
      });
    });

    $('#m-ok').addEventListener('click', () => {
      $('#modal').hidden = true;
      const fn = pendingOk;
      pendingOk = null;
      if (fn) fn();
    });
    $('#m-cancel').addEventListener('click', () => {
      $('#modal').hidden = true;
      pendingOk = null;
    });

    last = performance.now();
    setInterval(tick, 100);
    setInterval(save, 5000);
    window.addEventListener('beforeunload', save);
    render();
  }

  init();
})();
</script>

</body></html>
